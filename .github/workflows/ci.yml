name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Julia nightly is an early-warning signal, not a release gate.
    # Upstream regressions on master (e.g. the 2026-05-02 Windows
    # STATUS_ACCESS_VIOLATION segfault) are out of our control, and a
    # red CI badge from those would be misleading. Released versions
    # (1.10, 1.11) still gate the workflow.
    continue-on-error: ${{ matrix.julia-version == 'nightly' }}
    strategy:
      matrix:
        julia-version: ['1.10', '1.11', 'nightly']
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: auto
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1.11'
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1.11'
        with:
          files: lcov.info
          fail_ci_if_error: false
