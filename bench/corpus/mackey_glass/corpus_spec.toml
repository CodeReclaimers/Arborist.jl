# Mackey-Glass τ=17 time-series corpus specification.
#
# Classical chaotic-dynamics test. Series generated by RK4 integration of
# dx/dt = β·x(t-τ)/(1 + x(t-τ)^p) - γ·x(t) with
#   β = 0.2, γ = 0.1, p = 10, τ = 17, dt = 1.0
# starting from constant 1.2, discarding burn_in=500 transient samples.
# Target is one-step-ahead prediction: x[t+1] given x[t] as input.
# All parameters here make the dataset bytewise-deterministic; the
# solver uses the sampled series identically across repetitions.

n_train = 500
tau = 17
burn_in = 500

pop_size = 150
generations = 100
