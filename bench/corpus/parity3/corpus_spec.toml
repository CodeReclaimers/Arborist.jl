# 3-bit parity NEAT corpus specification.
#
# Fully enumerated boolean domain (2^n_bits = 8 cases) — the "corpus" is
# determined entirely by n_bits. Output = XOR of all n_bits input bits.
# Target 1 for odd number of 1-bits, 0 otherwise.

n_bits = 3

# Solver budget per repetition. Matches test/benchmarks/parity_neat.jl.
pop_size = 200
generations = 500
